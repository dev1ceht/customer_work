schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .
    include:
      - SKILL.md
      - references/**

engine:
  name: codex

cases:
  files:
    - evals/cases/normal-status.yaml
    - evals/cases/stale-trace.yaml
    - evals/cases/unknown-order.yaml
    - evals/cases/signature-dispute.yaml
  defaults:
    timeout_seconds: 120
    max_turns: 5

report:
  formats: [json]
