id: shipped-order
title: 已发货订单进入退货退款或人工流程
description: 验证已发货订单不被误判为自动仅退款，并明确进入安全分支。

input:
  prompt: |
    用户问：“订单 20260613001 已经发货了，我还能直接退款吗？”
    queryOrder 返回 paymentStatus=PAID、fulfillmentStatus=SHIPPED、orderAmount=299.00。
    checkRefundEligibility 返回 decision=HUMAN_REVIEW、reasonCodes=[ORDER_ALREADY_SHIPPED]、refundableAmount=null。
    请根据 refund-handling Skill 回复用户。

expect:
  must_contain: ["已发货", "人工"]

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["已发货"]
        any: ["退货退款", "人工"]
        not: ["已提交退款申请", "退款已到账", "已为您退款"]
